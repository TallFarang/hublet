<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark">
  <title>Sign in · Hublet</title>
  <link rel="stylesheet" href="/static/pico.min.css?v={{ static_version }}">
  <link rel="stylesheet" href="/static/tokens.css?v={{ static_version }}">
  <link rel="stylesheet" href="/static/shell.css?v={{ static_version }}">
  <link rel="stylesheet" href="/static/forms.css?v={{ static_version }}">
</head>
<body class="login-page">
<!--
THESIS: Hublet is a quiet instrument panel for personal facts, not a prose-heavy analytics suite.
OWN-WORLD: Matte black, ruled charcoal fields, native sans type, tabular readings and restrained signals.
STORY: Authenticate once, then go directly to the dashboard.
FIRST VIEWPORT: One credential field and one action on an otherwise quiet surface.
FORM: Restrained night instruments, grounded direction three, seed 0d2c80e8.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
  <main class="login-shell">
    <a class="login-brand" href="/">Hublet</a>
    <h1>Sign in</h1>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="token">Dashboard token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
