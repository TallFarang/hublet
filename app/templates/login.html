<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in · Hublet</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
<!--
THESIS: A home wall organizer makes three small tools immediately graspable; it refuses an analytics dashboard.
OWN-WORLD: Cool utility gray, ink blue and three saturated bays; molded panels, precise labels and soft offset depth.
STORY: Sign in once on a trusted device, then return directly to the three tools.
FIRST VIEWPORT: One compact credential panel with the action immediately beneath the field.
FORM: Modular household organizer, grounded direction seven, seed 3fa22c15.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
  <main class="login-shell">
    <div class="login-brand" aria-hidden="true"><span></span></div>
    <h1>Come on in.</h1>
    <p>Use the dashboard token once. This device will remember you.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="token">Dashboard token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
