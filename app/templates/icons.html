{% macro icon(name, label=none) -%}
<svg class="lucide lucide-{{ name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %}>
  {% if name == "goals" %}
  <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
  {% elif name == "food" %}
  <path d="M3 2v7c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
  {% elif name == "recipes" %}
  <path d="M12 7v14M3 18a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3ZM21 18a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-5a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3Z"/>
  {% elif name == "coffee" %}
  <path d="M10 2v2M14 2v2M6 2v2M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4Z"/>
  {% elif name == "health" %}
  <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
  {% elif name == "log-out" %}
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
  {% elif name == "chevron-down" %}
  <path d="m6 9 6 6 6-6"/>
  {% endif %}
</svg>
{%- endmacro %}

{% macro plugin_icon(name) -%}{{ icon(name) }}{%- endmacro %}
