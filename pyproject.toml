[project]
name = "hublet"
version = "0.0.0"
description = "Lightweight personal structured-memory daemon for OpenClaw"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "mcp==2.0.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "uvicorn==0.52.3",
]

[project.scripts]
hublet-backup = "app.backup:main"
hublet-food-import = "app.plugins.food_import:main"

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py313"
